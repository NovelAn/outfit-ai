[project]
name = "outfit-ai"
version = "0.1.0"
description = "Personal AI wardrobe — stable-yet-exploring outfit recommendations"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.2",
    "openai>=1.40",
    "httpx>=0.27",
    "pillow>=10.4",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "rembg[cpu]>=2.0.67",
    "numba==0.62.1; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "onnxruntime==1.23.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
